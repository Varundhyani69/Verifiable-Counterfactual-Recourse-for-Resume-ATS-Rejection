name: CI

on:
  push:
    branches: ["integration", "main", "varun/**", "vaishnavi/**", "vipul/**", "dhruv/**", "yash/**", "shahin/**"]
  pull_request:
    branches: ["integration"]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + type-check + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recourse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/recourse_test
      UPLOAD_DIR: /tmp/uploads
      MAX_FILE_SIZE_MB: "10"
      MAX_MANUAL_CHARS: "50000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Type-check (mypy)
        run: mypy backend/

      - name: Run tests with coverage
        run: pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + type-check + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test -- --coverage
