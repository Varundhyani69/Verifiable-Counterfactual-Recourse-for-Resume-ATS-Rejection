[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "verifiable-counterfactual-recourse"
version = "0.1.0"
description = "Research system for truth-constrained minimal-edit counterfactual resume recourse"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Data validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    # NLP / ML
    "sentence-transformers==2.7.0",
    "spacy==3.7.5",
    "transformers==4.40.1",
    "torch==2.3.0",
    # Document processing
    "pymupdf==1.24.3",
    "python-docx==1.1.0",
    "pytesseract==0.3.10",
    "Pillow==10.3.0",
    # Export
    "reportlab==4.1.0",
    # Utilities
    "python-multipart==0.0.9",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",          # FastAPI test client
    "hypothesis==6.100.1",
    # Linting / typing
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-Pillow",
]
s3 = [
    "boto3==1.34.84",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "tests*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "B008",    # Do not perform function calls in argument defaults (FastAPI DI / Query)
    "UP042",   # Class inherits from both str and enum.Enum (standard for SQLAlchemy)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "frontend/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
